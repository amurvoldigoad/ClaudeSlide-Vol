          package com.pribadi.volume;

          import android.Manifest;
          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private VolumePanel panel;
              private Button toggleBtn;
              private Button dndBtn;
              private boolean wantStart = false;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  int pad = Ui.dp(this, 24);
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, Ui.dp(this, 36), pad, pad);
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("Volume");
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 28);
                  title.setTextColor(Ui.text(this));
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  panel = new VolumePanel(this, this::onNeedDnd);
                  root.addView(panel, params(28));

                  toggleBtn = button("", true);
                  toggleBtn.setOnClickListener(v -> onToggle());
                  root.addView(toggleBtn, params(36));

                  dndBtn = button("Izinkan akses Jangan Ganggu", false);
                  dndBtn.setOnClickListener(v -> openDndSettings());
                  root.addView(dndBtn, params(12));

                  TextView hint = new TextView(this);
                  hint.setText("Ketuk gelembung hijau untuk membuka slider. "
                          + "Tahan dan seret gelembung untuk memindahkannya.");
                  hint.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  hint.setTextColor(Ui.soft(this));
                  root.addView(hint, params(20));

                  setContentView(scroll);

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (wantStart) {
                      wantStart = false;
                      if (Settings.canDrawOverlays(this)) {
                          startBubble();
                          toggleBtn.postDelayed(this::updateUi, 400);
                      }
                  }
                  updateUi();
              }

              private LinearLayout.LayoutParams params(int topDp) {
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = Ui.dp(this, topDp);
                  return lp;
              }

              private Button button(String text, boolean primary) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  b.setMinHeight(Ui.dp(this, 52));
                  b.setStateListAnimator(null);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(Ui.dp(this, 26));
                  bg.setColor(primary ? Ui.GREEN : Ui.surface(this));
                  b.setBackground(bg);
                  b.setTextColor(primary ? Color.WHITE : Ui.text(this));
                  return b;
              }

              private void onToggle() {
                  if (BubbleService.running) {
                      Prefs.setEnabled(this, false);
                      BubbleService.stop(this);
                  } else if (!Settings.canDrawOverlays(this)) {
                      wantStart = true;
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                  } else {
                      startBubble();
                  }
                  toggleBtn.postDelayed(this::updateUi, 400);
              }

              private void startBubble() {
                  Prefs.setEnabled(this, true);
                  BubbleService.start(this);
              }

              private void onNeedDnd() {
                  Toast.makeText(this, "Beri izin Jangan Ganggu agar Dering bisa disenyapkan",
                          Toast.LENGTH_LONG).show();
                  openDndSettings();
              }

              private void openDndSettings() {
                  try {
                      startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                  } catch (RuntimeException ignored) {
                  }
              }

              private void updateUi() {
                  if (BubbleService.running) {
                      toggleBtn.setText("Matikan gelembung");
                  } else if (Settings.canDrawOverlays(this)) {
                      toggleBtn.setText("Aktifkan gelembung");
                  } else {
                      toggleBtn.setText("Izinkan & aktifkan gelembung");
                  }
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  boolean dndOk = nm != null && nm.isNotificationPolicyAccessGranted();
                  dndBtn.setVisibility(dndOk ? View.GONE : View.VISIBLE);
                  panel.refresh();
              }
          }
