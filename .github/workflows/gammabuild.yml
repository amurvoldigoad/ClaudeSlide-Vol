          package com.pribadi.volume;

          import android.content.Context;
          import android.content.res.Configuration;

          final class Ui {
              static final int GREEN = 0xFF2FB67E;

              private Ui() {}

              static boolean dark(Context c) {
                  int m = c.getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                  return m == Configuration.UI_MODE_NIGHT_YES;
              }

              static int dp(Context c, float v) {
                  return Math.round(v * c.getResources().getDisplayMetrics().density);
              }

              static int bg(Context c) { return dark(c) ? 0xFF121214 : 0xFFFFFFFF; }
              static int card(Context c) { return dark(c) ? 0xFF2B2D31 : 0xFFFFFFFF; }
              static int surface(Context c) { return dark(c) ? 0xFF2B2D31 : 0xFFF1F3F4; }
              static int text(Context c) { return dark(c) ? 0xFFE6E6E9 : 0xFF5F6368; }
              static int soft(Context c) { return dark(c) ? 0xFFA0A4AA : 0xFF8A8F95; }
              static int track(Context c) { return dark(c) ? 0xFF55585E : 0xFFD0D0D0; }
          }
          __BERKAS_SELESAI__

