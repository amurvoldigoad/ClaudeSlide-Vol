# Volume Slider - build APK otomatis di GitHub Actions
# Seluruh kode aplikasi ada di dalam berkas ini. Tidak perlu PC.
name: Build APK Volume Slider

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || true)"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Unduh Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: "Tulis settings.gradle"
        run: |
          mkdir -p "proj/"
          cat > "proj/settings.gradle" <<'__BERKAS_SELESAI__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VolumeSlider"
          include ':app'
          __BERKAS_SELESAI__

      - name: "Tulis build.gradle"
        run: |
          mkdir -p "proj/"
          cat > "proj/build.gradle" <<'__BERKAS_SELESAI__'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          __BERKAS_SELESAI__

      - name: "Tulis gradle.properties"
        run: |
          mkdir -p "proj/"
          cat > "proj/gradle.properties" <<'__BERKAS_SELESAI__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          __BERKAS_SELESAI__

      - name: "Tulis app/build.gradle"
        run: |
          mkdir -p "proj/app"
          cat > "proj/app/build.gradle" <<'__BERKAS_SELESAI__'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pribadi.volume'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pribadi.volume'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storeType 'pkcs12'
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          __BERKAS_SELESAI__

      - name: "Tulis app/src/main/AndroidManifest.xml"
        run: |
          mkdir -p "proj/app/src/main"
          cat > "proj/app/src/main/AndroidManifest.xml" <<'__BERKAS_SELESAI__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Volume"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PanelActivity"
                      android:exported="false"
                      android:theme="@style/PanelTheme"
                      android:launchMode="singleTask"
                      android:taskAffinity=""
                      android:excludeFromRecents="true" />

                  <service
                      android:name=".BubbleService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="gelembung kontrol volume mengambang" />
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          __BERKAS_SELESAI__

