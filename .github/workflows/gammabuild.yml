      - name: Build APK
        working-directory: proj
        run: $GITHUB_WORKSPACE/gradle-8.10.2/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan berkas APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk VolumeSlider.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeSlider-APK
          path: VolumeSlider.apk

      - name: Buat Release supaya APK bisa diunduh langsung
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" VolumeSlider.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Volume Slider #${{ github.run_number }}" \
            --notes "APK siap dipasang. Unduh VolumeSlider.apk di bawah."
