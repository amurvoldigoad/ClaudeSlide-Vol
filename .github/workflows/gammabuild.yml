      - name: "Tulis app/src/main/java/com/pribadi/volume/BubbleService.java"
        run: |
          mkdir -p "proj/app/src/main/java/com/pribadi/volume"
          cat > "proj/app/src/main/java/com/pribadi/volume/BubbleService.java" <<'__BERKAS_SELESAI__'
          package com.pribadi.volume;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          public class BubbleService extends Service {
              static final String ACTION_STOP = "com.pribadi.volume.STOP";
              private static final String CHANNEL = "bubble";
              private static final int NOTIF_ID = 1;
              static volatile boolean running = false;

              private WindowManager wm;
              private FrameLayout bubble;
              private WindowManager.LayoutParams bubbleLp;
              private int size;
              private boolean right = true;
              private int touchSlop;
              private float downX;
              private float downY;
              private int startX;
              private int startY;
              private boolean moved;

              static void start(Context c) {
                  c.startForegroundService(new Intent(c, BubbleService.class));
              }

              static void stop(Context c) {
                  c.stopService(new Intent(c, BubbleService.class));
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  running = true;
                  wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  size = Ui.dp(this, 48);
                  touchSlop = ViewConfiguration.get(this).getScaledTouchSlop();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!startAsForeground()) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      Prefs.setEnabled(this, false);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  showBubble();
                  return START_STICKY;
              }

              private boolean startAsForeground() {
                  try {
                      Notification n = buildNotification();
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                      } else {
                          startForeground(NOTIF_ID, n);
                      }
                      return true;
                  } catch (RuntimeException e) {
                      return false;
                  }
              }

              private Notification buildNotification() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(
                          CHANNEL, "Gelembung volume", NotificationManager.IMPORTANCE_LOW));

                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  PendingIntent stop = PendingIntent.getService(this, 1,
                          new Intent(this, BubbleService.class).setAction(ACTION_STOP),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  return new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_volume)
                          .setContentTitle("Gelembung volume aktif")
                          .setContentText("Ketuk untuk membuka aplikasi")
                          .setContentIntent(open)
                          .setOngoing(true)
                          .addAction(new Notification.Action.Builder(
                                  Icon.createWithResource(this, R.drawable.ic_volume), "Matikan", stop).build())
                          .build();
              }

              private int screenW() {
                  return getResources().getDisplayMetrics().widthPixels;
              }

              private int screenH() {
                  return getResources().getDisplayMetrics().heightPixels;
              }

              private int clampX(int x) {
                  return Math.max(0, Math.min(screenW() - size, x));
              }

              private int clampY(int y) {
                  return Math.max(0, Math.min(screenH() - size, y));
              }

              private void showBubble() {
                  if (bubble != null) return;

                  bubble = new FrameLayout(this);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(Ui.GREEN);
                  bubble.setBackground(bg);
                  bubble.setAlpha(0.85f);

                  ImageView icon = new ImageView(this);
                  icon.setImageResource(R.drawable.ic_volume);
                  icon.setColorFilter(Color.WHITE);
                  int p = Ui.dp(this, 12);
                  icon.setPadding(p, p, p, p);
                  bubble.addView(icon, new FrameLayout.LayoutParams(size, size));

                  bubbleLp = new WindowManager.LayoutParams(size, size,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  bubbleLp.gravity = Gravity.TOP | Gravity.START;
                  right = Prefs.right(this);
                  bubbleLp.x = right ? screenW() - size : 0;
                  bubbleLp.y = clampY(Prefs.y(this, screenH() / 3));

                  bubble.setOnTouchListener(this::onBubbleTouch);
                  try {
                      wm.addView(bubble, bubbleLp);
                  } catch (RuntimeException e) {
                      bubble = null;
                      stopSelf();
                  }
              }

              private boolean onBubbleTouch(View v, MotionEvent e) {
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          downX = e.getRawX();
                          downY = e.getRawY();
                          startX = bubbleLp.x;
                          startY = bubbleLp.y;
                          moved = false;
                          return true;
                      case MotionEvent.ACTION_MOVE: {
                          float dx = e.getRawX() - downX;
                          float dy = e.getRawY() - downY;
                          if (!moved && Math.hypot(dx, dy) > touchSlop) moved = true;
                          if (moved) {
                              bubbleLp.x = clampX(startX + (int) dx);
                              bubbleLp.y = clampY(startY + (int) dy);
                              updateBubble();
                          }
                          return true;
                      }
                      case MotionEvent.ACTION_UP:
                          if (moved) {
                              snapToEdge();
                          } else {
                              togglePanel();
                          }
                          return true;
                      case MotionEvent.ACTION_CANCEL:
                          if (moved) snapToEdge();
                          return true;
                      default:
                          return false;
                  }
              }

              private void snapToEdge() {
                  right = bubbleLp.x + size / 2 > screenW() / 2;
                  bubbleLp.x = right ? screenW() - size : 0;
                  bubbleLp.y = clampY(bubbleLp.y);
                  updateBubble();
                  Prefs.setPos(this, right, bubbleLp.y);
              }

              private void updateBubble() {
                  if (bubble == null) return;
                  try {
                      wm.updateViewLayout(bubble, bubbleLp);
                  } catch (RuntimeException ignored) {
                  }
              }

              // Volume sekarang diatur dari Activity yang terlihat (PanelActivity).
              // Sejak Android 12 (dan makin ketat di Android 17), perubahan volume dari
              // service latar belakang diabaikan sistem tanpa pesan error.
              private void togglePanel() {
                  PanelActivity open = PanelActivity.current;
                  if (open != null) {
                      open.finish();
                      return;
                  }
                  try {
                      startActivity(new Intent(this, PanelActivity.class)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                  } catch (RuntimeException ignored) {
                  }
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  if (bubble != null) {
                      bubbleLp.x = right ? screenW() - size : 0;
                      bubbleLp.y = clampY(bubbleLp.y);
                      updateBubble();
                  }
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (bubble != null) {
                      try {
                          wm.removeView(bubble);
                      } catch (RuntimeException ignored) {
                      }
                      bubble = null;
                  }
                  super.onDestroy();
              }
          }
