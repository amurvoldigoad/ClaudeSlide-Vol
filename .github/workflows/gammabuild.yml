      - name: "Tulis app/src/main/java/com/pribadi/volume/VolumeSlider.java"
        run: |
          mkdir -p "proj/app/src/main/java/com/pribadi/volume"
          cat > "proj/app/src/main/java/com/pribadi/volume/VolumeSlider.java" <<'__BERKAS_SELESAI__'
          package com.pribadi.volume;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.view.HapticFeedbackConstants;
          import android.view.MotionEvent;
          import android.view.View;

          public class VolumeSlider extends View {
              public interface Listener {
                  void onChange(int value);
              }

              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final float dp;
              private final int trackColor;
              private int min = 0;
              private int max = 1;
              private int value = 0;
              private boolean dragging = false;
              private Listener listener;

              public VolumeSlider(Context c) {
                  super(c);
                  dp = c.getResources().getDisplayMetrics().density;
                  trackColor = Ui.track(c);
                  paint.setStrokeCap(Paint.Cap.ROUND);
              }

              public void setListener(Listener l) {
                  listener = l;
              }

              public void setRange(int newMin, int newMax) {
                  min = newMin;
                  max = Math.max(newMax, newMin + 1);
                  value = clamp(value);
                  invalidate();
              }

              public void forceValue(int v) {
                  value = clamp(v);
                  invalidate();
              }

              public int getValue() { return value; }
              public int getMin() { return min; }
              public int getMax() { return max; }
              public boolean isDragging() { return dragging; }

              private int clamp(int v) {
                  return Math.max(min, Math.min(max, v));
              }

              private float pad() {
                  return 18f * dp;
              }

              @Override
              protected void onMeasure(int widthSpec, int heightSpec) {
                  int w = resolveSize((int) (120 * dp), widthSpec);
                  setMeasuredDimension(w, (int) (44 * dp));
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  float left = pad();
                  float right = getWidth() - pad();
                  float cy = getHeight() / 2f;
                  float frac = (value - min) / (float) (max - min);
                  float x = left + (right - left) * frac;

                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(4f * dp);
                  paint.setColor(trackColor);
                  canvas.drawLine(left, cy, right, cy, paint);
                  paint.setColor(Ui.GREEN);
                  canvas.drawLine(left, cy, x, cy, paint);

                  paint.setStyle(Paint.Style.FILL);
                  float r = (dragging ? 14f : 12f) * dp;
                  paint.setColor(0x14000000);
                  canvas.drawCircle(x, cy + dp, r + 2.5f * dp, paint);
                  paint.setColor(0x26000000);
                  canvas.drawCircle(x, cy + 0.5f * dp, r + dp, paint);
                  paint.setColor(0xFFFFFFFF);
                  canvas.drawCircle(x, cy, r, paint);
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(true);
                          dragging = true;
                          update(e.getX());
                          return true;
                      case MotionEvent.ACTION_MOVE:
                          update(e.getX());
                          return true;
                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_CANCEL:
                          dragging = false;
                          invalidate();
                          return true;
                      default:
                          return super.onTouchEvent(e);
                  }
              }

              private void update(float x) {
                  float left = pad();
                  float right = getWidth() - pad();
                  float f = (x - left) / (right - left);
                  if (f < 0f) f = 0f;
                  if (f > 1f) f = 1f;
                  int v = min + Math.round(f * (max - min));
                  if (v != value) {
                      value = v;
                      performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK);
                      if (listener != null) listener.onChange(v);
                  }
                  invalidate();
              }
          }
          __BERKAS_SELESAI__

      - name: "Tulis app/src/main/java/com/pribadi/volume/VolumePanel.java"
        run: |
          mkdir -p "proj/app/src/main/java/com/pribadi/volume"
          cat > "proj/app/src/main/java/com/pribadi/volume/VolumePanel.java" <<'__BERKAS_SELESAI__'
          package com.pribadi.volume;

          import android.content.Context;
          import android.database.ContentObserver;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class VolumePanel extends LinearLayout {
              private static final int[] STREAMS = {
                      AudioManager.STREAM_RING, AudioManager.STREAM_MUSIC, AudioManager.STREAM_ALARM};
              private static final String[] NAMES = {"Dering", "Media", "Alarm"};
              private static final int[] ICONS = {R.drawable.ic_bell, R.drawable.ic_music, R.drawable.ic_alarm};

              private final AudioManager am;
              private final Runnable onNeedDnd;
              private final VolumeSlider[] sliders = new VolumeSlider[3];
              private final TextView[] valueViews = new TextView[3];
              private boolean dndAsked = false;

              private final ContentObserver observer =
                      new ContentObserver(new Handler(Looper.getMainLooper())) {
                          @Override
                          public void onChange(boolean selfChange) {
                              refresh();
                          }
                      };

              public VolumePanel(Context c, Runnable onNeedDnd) {
                  super(c);
                  this.onNeedDnd = onNeedDnd;
                  this.am = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
                  setOrientation(VERTICAL);
                  for (int i = 0; i < 3; i++) {
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      if (i > 0) lp.topMargin = Ui.dp(c, 14);
                      addView(buildRow(c, i), lp);
                  }
                  refresh();
              }

              private View buildRow(Context c, final int i) {
                  LinearLayout row = new LinearLayout(c);
                  row.setOrientation(VERTICAL);

                  LinearLayout head = new LinearLayout(c);
                  head.setOrientation(HORIZONTAL);
                  TextView name = label(c, NAMES[i], 15, Ui.text(c));
                  TextView val = label(c, "", 13, Ui.soft(c));
                  val.setGravity(Gravity.END);
                  valueViews[i] = val;
                  head.addView(name, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  head.addView(val, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));

                  LinearLayout line = new LinearLayout(c);
                  line.setOrientation(HORIZONTAL);
                  line.setGravity(Gravity.CENTER_VERTICAL);

                  VolumeSlider slider = new VolumeSlider(c);
                  slider.setRange(minVolume(STREAMS[i]), am.getStreamMaxVolume(STREAMS[i]));
                  slider.setListener(v -> apply(i, v));
                  sliders[i] = slider;

                  line.addView(icon(c, ICONS[i]), new LinearLayout.LayoutParams(Ui.dp(c, 18), Ui.dp(c, 18)));
                  line.addView(slider, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  line.addView(icon(c, ICONS[i]), new LinearLayout.LayoutParams(Ui.dp(c, 26), Ui.dp(c, 26)));

                  row.addView(head);
                  row.addView(line);
                  return row;
              }

              private int minVolume(int stream) {
                  if (Build.VERSION.SDK_INT >= 28) return am.getStreamMinVolume(stream);
                  return stream == AudioManager.STREAM_ALARM ? 1 : 0;
              }

              private void apply(int i, int v) {
                  int stream = STREAMS[i];
                  int flags = stream == AudioManager.STREAM_RING ? AudioManager.FLAG_ALLOW_RINGER_MODES : 0;
                  try {
                      am.setStreamVolume(stream, v, flags);
                  } catch (SecurityException e) {
                      sliders[i].forceValue(readVolume(i));
                      if (!dndAsked) {
                          dndAsked = true;
                          if (onNeedDnd != null) onNeedDnd.run();
                      }
                  } catch (RuntimeException ignored) {
                  }
                  showValue(i);
              }

              private int readVolume(int i) {
                  int stream = STREAMS[i];
                  if (stream == AudioManager.STREAM_RING
                          && am.getRingerMode() != AudioManager.RINGER_MODE_NORMAL) {
                      return sliders[i].getMin();
                  }
                  return am.getStreamVolume(stream);
              }

              private void showValue(int i) {
                  String t;
                  boolean ring = STREAMS[i] == AudioManager.STREAM_RING;
                  int mode = am.getRingerMode();
                  if (ring && mode == AudioManager.RINGER_MODE_VIBRATE) {
                      t = "Getar";
                  } else if (ring && mode == AudioManager.RINGER_MODE_SILENT) {
                      t = "Senyap";
                  } else {
                      t = sliders[i].getValue() + "/" + sliders[i].getMax();
                  }
                  valueViews[i].setText(t);
              }

              public void refresh() {
                  for (int i = 0; i < 3; i++) {
                      if (sliders[i] == null || sliders[i].isDragging()) continue;
                      sliders[i].forceValue(readVolume(i));
                      showValue(i);
                  }
              }

              @Override
              protected void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  getContext().getContentResolver()
                          .registerContentObserver(Settings.System.CONTENT_URI, true, observer);
                  refresh();
              }

              @Override
              protected void onDetachedFromWindow() {
                  getContext().getContentResolver().unregisterContentObserver(observer);
                  super.onDetachedFromWindow();
              }

              private static TextView label(Context c, String s, float sp, int color) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(color);
                  return t;
              }

              private static ImageView icon(Context c, int res) {
                  ImageView v = new ImageView(c);
                  v.setImageResource(res);
                  v.setColorFilter(Ui.soft(c));
                  return v;
              }
          }
