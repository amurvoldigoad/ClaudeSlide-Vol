          package com.pribadi.volume;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          public class PanelActivity extends Activity {
              static PanelActivity current;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  current = this;

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0x33000000);
                  root.setOnClickListener(v -> finish());

                  FrameLayout card = new FrameLayout(this);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Ui.card(this));
                  bg.setCornerRadius(Ui.dp(this, 24));
                  card.setBackground(bg);
                  card.setClickable(true);
                  int pad = Ui.dp(this, 20);
                  card.setPadding(pad, pad, pad, Ui.dp(this, 14));
                  card.addView(new VolumePanel(this, this::onNeedDnd), new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT));

                  int screenW = getResources().getDisplayMetrics().widthPixels;
                  int w = Math.min(Ui.dp(this, 360), (int) (screenW * 0.92f));
                  root.addView(card, new FrameLayout.LayoutParams(
                          w, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
                  setContentView(root);
              }

              private void onNeedDnd() {
                  Toast.makeText(this, "Beri izin Jangan Ganggu agar Dering bisa disenyapkan",
                          Toast.LENGTH_LONG).show();
                  try {
                      startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                  } catch (RuntimeException ignored) {
                  }
                  finish();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (!isFinishing()) finish();
              }

              @Override
              protected void onDestroy() {
                  if (current == this) current = null;
                  super.onDestroy();
              }
          }
